name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck tests/*.sh scripts/*.sh skills/*/scripts/*.sh
      - run: tests/scripts.sh
      - run: npm install --global @anthropic-ai/claude-code@2.1.319
      - run: claude plugin validate .
